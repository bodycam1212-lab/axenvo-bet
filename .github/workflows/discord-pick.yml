name: Discord Pick Meldung

on:
  push:
    paths:
      - "picks.json"
  workflow_dispatch:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Discord Nachricht senden
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -f -H "Content-Type: application/json" \
            -d '{"content":"🟢 **WINTIQ BET – TEST ERFOLGREICH!**\n\nDie Verbindung von GitHub zu Discord funktioniert."}' \
            "$WEBHOOK"
