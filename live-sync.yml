name: WINTIQ live data sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync live sports data
        run: node scripts/sync-live.mjs
      - name: Commit updated live data
        run: |
          git config user.name "wintiq-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live-data.json
          git diff --cached --quiet || git commit -m "chore: update live sports data"
          git push
