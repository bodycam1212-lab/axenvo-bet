name: WINTIQ Live Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update live data
        run: node scripts/sync-live.mjs
      - name: Commit live data
        run: |
          git config user.name "wintiq-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live-data.json
          git diff --cached --quiet || git commit -m "chore: update live data"
          git push
